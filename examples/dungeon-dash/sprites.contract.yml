# yaml-language-server: $schema=../../schema/sprite-contract.schema.json
contract: "1.0"

project:
  name: Dungeon Dash
  description: A tiny top-down dungeon crawler. All art is 16-bit style pixel art.
  root: game                 # targets below are relative to ./game

# Other contract files. Split by domain so several people (or AIs) can own one file each.
include:
  - contracts/*.yml
  - contracts/*.json

# Applies to every sprite unless a file, folder or sprite overrides it.
defaults:
  spec:
    alpha: required          # sprites need transparent backgrounds
    formats: [png]
  tags: [pixel-art]

# Optional folder metadata for the UI. Folders themselves come from the sprite ids.
folders:
  characters:
    title: Characters
    icon: "🧙"
    description: Everything that walks. Facing sprites are 32x32, drawn on a transparent background.
    defaults:
      spec: { width: 32, height: 32 }
  tiles:
    title: Tiles
    icon: "🧱"
    description: 16x16 environment tiles. They must tile seamlessly.
  ui:
    title: User interface
    icon: "🖱️"
    description: HUD and menu art.
