# yaml-language-server: $schema=https://raw.githubusercontent.com/JanMoritzP/image-administration/main/schema/sprite-contract.schema.json
# Sprite Contract. Full reference: docs/CONTRACT.md
contract: "1.0"

project:
  name: My App
  description: One sentence about the app so people know the art style and context.
  root: .                    # targets are relative to this directory (relative to this file)

defaults:
  spec:
    formats: [png]
    alpha: required

folders:
  characters:
    title: Characters
    description: What lives in this folder, shown in the UI.

sprites:
  - id: characters/player
    description: Describe exactly what the image shows, in enough detail that someone who has never seen the app can draw it.
    spec: { width: 32, height: 32 }
    target: assets/sprites/player.png
